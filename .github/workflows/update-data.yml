name: Update NyayClock Data

# Auto-updates NJDG numbers + PIB announcements daily.
# Free forever: public repo = unlimited Actions minutes.
# Only commits when data actually changed (hash comparison), so most runs cost seconds.

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch: {}     # manual trigger button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scraper/update-data.js

      - name: Commit if changed
        run: |
          git config user.name "nyayclock-bot"
          git config user.email "bot@nyayclock.local"
          git add data/njdglive.json data/announcements.json data/provenance.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
            git push
          fi
